name: docs
on:
  push:
    branches: [main]
    paths:
      - 'sites/spry.medz.dev/**'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [main]
    paths:
      - 'sites/spry.medz.dev/**'
      - '.github/workflows/docs.yml'
permissions:
  contents: read
jobs:
  docs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sites/spry.medz.dev
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: sites/spry.medz.dev/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=low
      - run: npm run docs:build
